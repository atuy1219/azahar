name: One-shot retain master and YW2 stub

on:
  pull_request:
    types: [closed]
    branches:
      - 'test/yw2-blasters-stub'

permissions:
  contents: write

jobs:
  retain-two:
    if: github.repository == 'atuy1219/azahar'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout retained stub branch
        uses: actions/checkout@v6
        with:
          ref: test/yw2-blasters-stub
          fetch-depth: 0

      - name: Retain only the two requested branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            --jq '.[].name' \
            | while IFS= read -r branch; do
                case "$branch" in
                  master|test/yw2-blasters-stub)
                    continue
                    ;;
                esac
                encoded="${branch//\//%2F}"
                gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
              done

      - name: Remove this one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/one-shot-retain-two-branches.yml
          git add -A
          git commit -m 'Remove completed final branch cleanup workflow'
          git push origin HEAD:refs/heads/test/yw2-blasters-stub
