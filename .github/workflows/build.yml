name: Azahar Linux x86_64 build

on:
  push:
    branches: [yw2/linux-only-trace]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    container:
      image: opensauce04/azahar-build-environment:latest
      options: -u 1001
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: linux
      TARGET: appimage
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: linux-appimage-${{ github.sha }}
          restore-keys: |
            linux-appimage-
      - name: Compile Linux AppImage
        run: ./.ci/linux.sh
      - name: Collect artifact
        run: |
          mkdir -p artifacts
          mv build/bundle/*.AppImage artifacts/
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: azahar-linux-x86_64-appimage
          path: artifacts/*.AppImage
          if-no-files-found: error
