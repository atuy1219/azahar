name: Android Builds

on:
  push:
    branches:
      - 'test/yw2-blasters-stub'
  workflow_dispatch:

jobs:
  android-debug:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: android
      TARGET: debug
      ANDROID_ABI_FILTERS: arm64-v8a
      ANDROID_CMAKE_TARGETS: citra-android
      SKIP_VULKAN_VALIDATION_LAYERS: 1
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ env.OS }}-${{ env.TARGET }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ env.OS }}-${{ env.TARGET }}-

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache apksigner -y

      - name: Update Android SDK CMake version
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"

      - name: Patch Android config validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/android/app/src/main/jni/config.cpp')
          text = path.read_text()
          start = text.index('void Config::Reload() {')
          load_ini = text.index('    LoadINI(DefaultINI::android_config_default_file_content);', start)
          replacement = '''void Config::Reload() {
              for (auto key = Settings::Keys::keys_array.begin(); key != Settings::Keys::keys_array.end();
                   ++key) {
                  const auto key_declaration_string = std::string(*key) + " =";
                  bool is_omitted = false;
                  for (const auto& omitted_key : DefaultINI::android_config_omitted_keys) {
                      if (std::string(omitted_key) == std::string(*key)) {
                          is_omitted = true;
                          break;
                      }
                  }
                  if (!is_omitted &&
                      std::string(DefaultINI::android_config_default_file_content)
                              .find(key_declaration_string) == std::string::npos) {
                      ASSERT_MSG(false,
                                 "Validation of default config content (jni/default_ini.h) failed: Missing "
                                 "declaration for key '{}'",
                                 *key);
                  }
              }
          '''
          path.write_text(text[:start] + replacement + text[load_ini:])
          print('Patched Android config validation to compare omitted keys by string')
          PY

      - name: Apply YW2 UDS trace patch
        run: python3 .github/scripts/yw2_uds_trace_patch.py

      - name: Apply YW2 UDS state trace patch
        run: python3 .github/scripts/yw2_uds_state_trace_patch.py

      - name: Apply YW2 UDS destroy and dummy-node patch
        run: python3 .github/scripts/yw2_uds_destroy_dummy_patch.py

      - name: Apply YW2 UDS beacon self-loopback patch
        run: python3 .github/scripts/yw2_uds_beacon_loopback_patch.py

      - name: Apply YW2 SVC wait trace patch
        run: python3 .github/scripts/yw2_svc_wait_trace_patch.py

      - name: Apply YW2 ARM PC trace patch
        run: python3 .github/scripts/yw2_arm_pc_trace_patch.py

      - name: Apply YW2 ARM PC trace runtime fix patch
        run: python3 .github/scripts/yw2_arm_pc_trace_runtime_fix_patch.py

      - name: Build Android Debug
        working-directory: src/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleVanillaDebug

          mkdir -p app/build/bundle
          find app/build/outputs/apk -name "*.apk" -exec cp {} app/build/bundle/ \;

      - name: Pack
        run: ../../../.ci/pack.sh
        working-directory: src/android/app
        env:
          UNPACKED: 1

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: src/android/app/artifacts/

  android-vanilla-release:
    name: Build Android Vanilla Release APK
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: android
      TARGET: vanilla
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ env.OS }}-${{ env.TARGET }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ env.OS }}-${{ env.TARGET }}-

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache apksigner -y

      - name: Update Android SDK CMake version
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3"

      - name: Patch Android config validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/android/app/src/main/jni/config.cpp')
          text = path.read_text()
          start = text.index('void Config::Reload() {')
          load_ini = text.index('    LoadINI(DefaultINI::android_config_default_file_content);', start)
          replacement = '''void Config::Reload() {
              for (auto key = Settings::Keys::keys_array.begin(); key != Settings::Keys::keys_array.end();
                   ++key) {
                  const auto key_declaration_string = std::string(*key) + " =";
                  bool is_omitted = false;
                  for (const auto& omitted_key : DefaultINI::android_config_omitted_keys) {
                      if (std::string(omitted_key) == std::string(*key)) {
                          is_omitted = true;
                          break;
                      }
                  }
                  if (!is_omitted &&
                      std::string(DefaultINI::android_config_default_file_content)
                              .find(key_declaration_string) == std::string::npos) {
                      ASSERT_MSG(false,
                                 "Validation of default config content (jni/default_ini.h) failed: Missing "
                                 "declaration for key '{}'",
                                 *key);
                  }
              }
          '''
          path.write_text(text[:start] + replacement + text[load_ini:])
          print('Patched Android config validation to compare omitted keys by string')
          PY

      - name: Apply YW2 UDS trace patch
        run: python3 .github/scripts/yw2_uds_trace_patch.py

      - name: Apply YW2 UDS state trace patch
        run: python3 .github/scripts/yw2_uds_state_trace_patch.py

      - name: Apply YW2 UDS destroy and dummy-node patch
        run: python3 .github/scripts/yw2_uds_destroy_dummy_patch.py

      - name: Apply YW2 UDS beacon self-loopback patch
        run: python3 .github/scripts/yw2_uds_beacon_loopback_patch.py

      - name: Apply YW2 SVC wait trace patch
        run: python3 .github/scripts/yw2_svc_wait_trace_patch.py

      - name: Apply YW2 ARM PC trace patch
        run: python3 .github/scripts/yw2_arm_pc_trace_patch.py

      - name: Apply YW2 ARM PC trace runtime fix patch
        run: python3 .github/scripts/yw2_arm_pc_trace_runtime_fix_patch.py

      - name: Build Android Vanilla Release
        run: JAVA_HOME=$JAVA_HOME_17_X64 ./.ci/android.sh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}

      - name: Pack
        run: ../../../.ci/pack.sh
        working-directory: src/android/app
        env:
          UNPACKED: 1

      - name: Upload Vanilla Release Artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-vanilla-release
          path: src/android/app/artifacts/
