name: Android Builds

on:
  push:
    branches:
      - 'test/yw2-blasters-stub'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Build Android ${{ matrix.label }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debug
            label: Debug
            cache_target: debug
            abi_filters: arm64-v8a
            cmake_targets: citra-android
            skip_vulkan_layers: '1'
            artifact_name: android-debug
          - variant: release
            label: Vanilla Release
            cache_target: vanilla
            abi_filters: arm64-v8a,x86_64
            cmake_targets: ''
            skip_vulkan_layers: '0'
            artifact_name: android-vanilla-release
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros
      OS: android
      TARGET: ${{ matrix.cache_target }}
      ANDROID_ABI_FILTERS: ${{ matrix.abi_filters }}
      ANDROID_CMAKE_TARGETS: ${{ matrix.cmake_targets }}
      SKIP_VULKAN_VALIDATION_LAYERS: ${{ matrix.skip_vulkan_layers }}

    steps:
      - name: Checkout latest master-based stub branch
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Prepare latest-master YW2 build controls
        run: python3 .github/hydrate_yw2_stub_on_master.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ env.OS }}-${{ env.TARGET }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ env.OS }}-${{ env.TARGET }}-

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install ccache apksigner -y

      - name: Update Android SDK CMake version
        run: |
          echo 'y' | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager 'cmake;3.30.3'

      - name: Apply YW2 UDS trace patch
        run: python3 .github/scripts/yw2_uds_trace_patch.py

      - name: Apply YW2 UDS state trace patch
        run: python3 .github/scripts/yw2_uds_state_trace_patch.py

      - name: Apply YW2 UDS destroy and dummy-node patch
        run: python3 .github/scripts/yw2_uds_destroy_dummy_patch.py

      - name: Apply YW2 UDS beacon self-loopback patch
        run: python3 .github/scripts/yw2_uds_beacon_loopback_patch.py

      - name: Apply YW2 SVC wait trace patch
        run: python3 .github/scripts/yw2_svc_wait_trace_patch.py

      - name: Apply YW2 FA read trace patch
        run: python3 .github/scripts/yw2_fa_read_trace_patch.py

      - name: Apply YW2 ARM PC trace patch
        run: python3 .github/scripts/yw2_arm_pc_trace_patch.py

      - name: Apply YW2 ARM PC trace runtime fix patch
        run: python3 .github/scripts/yw2_arm_pc_trace_runtime_fix_patch.py

      - name: Build Android Debug
        if: matrix.variant == 'debug'
        working-directory: src/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleVanillaDebug
          mkdir -p app/build/bundle
          find app/build/outputs/apk -name '*.apk' -exec cp {} app/build/bundle/ \;

      - name: Build Android Vanilla Release
        if: matrix.variant == 'release'
        run: JAVA_HOME=$JAVA_HOME_17_X64 ./.ci/android.sh
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}

      - name: Pack
        run: ../../../.ci/pack.sh
        working-directory: src/android/app
        env:
          UNPACKED: 1

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: src/android/app/artifacts/
